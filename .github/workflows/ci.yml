name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and runtime-free tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read shared tool pins
        id: tools
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          config: object = json.loads(Path("scripts/source-policy.json").read_text(encoding="utf-8"))
          if not isinstance(config, dict):
              raise SystemExit("source policy configuration must be an object")
          tools: object = config.get("tools")
          if not isinstance(tools, dict):
              raise SystemExit("source policy tool pins must be an object")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for name in ("ghc", "hlint", "fourmolu", "shellcheck"):
                  version: object = tools.get(name)
                  if not isinstance(version, str) or re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", version) is None:
                      raise SystemExit("invalid source policy tool pin: " + name)
                  output.write(name + "=" + version + "\n")
          PY
      - name: Set up GHC and Cabal
        id: haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ steps.tools.outputs.ghc }}
          cabal-version: '3.16.1.0'
          cabal-update: 'false'
      - name: Set up pinned HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2
        with:
          version: ${{ steps.tools.outputs.hlint }}
      - name: Set up pinned Fourmolu and ShellCheck
        env:
          FOURMOLU_VERSION: ${{ steps.tools.outputs.fourmolu }}
          SHELLCHECK_VERSION: ${{ steps.tools.outputs.shellcheck }}
        run: |
          tool_root="$RUNNER_TEMP/source-policy-tools"
          mkdir -p "$tool_root/bin"
          curl --fail --location --retry 3 \
            "https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip" \
            --output "$tool_root/fourmolu.zip"
          unzip -q "$tool_root/fourmolu.zip" -d "$tool_root"
          install -m 755 "$tool_root/fourmolu-${FOURMOLU_VERSION}-linux-x86_64/fourmolu" "$tool_root/bin/fourmolu"
          curl --fail --location --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$tool_root/shellcheck.tar.xz"
          tar -xJf "$tool_root/shellcheck.tar.xz" -C "$tool_root"
          install -m 755 "$tool_root/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$tool_root/bin/shellcheck"
          printf '%s\n' "$tool_root/bin" >> "$GITHUB_PATH"
      - name: Cache Cabal dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.haskell.outputs.ghc-version }}-cabal-${{ steps.haskell.outputs.cabal-version }}-${{ hashFiles('cost-translate.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.haskell.outputs.ghc-version }}-cabal-${{ steps.haskell.outputs.cabal-version }}-
      - name: Check compiler selection before building
        env:
          GHC: ${{ steps.haskell.outputs.ghc-exe }}
        run: |
          python3 test/compiler_preflight.py
          sh scripts/validate.sh --check-compiler
      - name: Update package index
        run: cabal update
      - name: Check source policy, lint, regressions, and runtime-free tests
        env:
          GHC: ${{ steps.haskell.outputs.ghc-exe }}
        run: sh scripts/validate.sh
      - name: Check committed example translations
        run: |
          # Regenerate from the inputs alone, so removing a source also removes its copy.
          rm -f examples/*M.hs
          printf '%s\n' examples/*.hs | cabal exec -- ghc -XGHC2021 -isrc -package ghc \
            src/Cost/Translate/Frontend.hs -e 'import System.FilePath' -e '
              let emit source = do
                    let output = dropExtension source ++ "M.hs"
                    (candidate, _) <- generate source (takeBaseName output)
                    either (fail . Cost.Translate.Diagnostic.renderDiagnostic) (writeFile output) candidate
              in getContents >>= mapM_ emit . lines'
          git add -Af -- ':(glob)examples/*M.hs'
          git diff --cached --exit-code -- ':(glob)examples/*M.hs'
