resolver:
  # lts-24.22 ghc-9.10.3 (same snapshot as the hs-pbt submodule)
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/22.yaml

packages:
# Register the pinned submodule for candidate typechecking and reference tests.
# The translator has no runtime build dependency (see docs/runtime.md).
- .
- hs-pbt

extra-deps:
# hs-pbt requires this QuickCheck; the snapshot ships a different one.
- QuickCheck-2.17.1.0

# Apply command-line warning flags to the selected package, not its dependencies.
apply-ghc-options: targets
