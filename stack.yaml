resolver:
  # lts-24.22 ghc-9.10.3 (same snapshot as the external hs-pbt reference)
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/22.yaml

packages:
# The translator package itself must not depend on the target runtime
# (hs-pbt); see docs/adr/0003-external-monadic-interface.md. Registering
# the external checkout here only provisions GHC's environment so
# `stack run cost-translate` can typecheck generated candidates.
- .
- hs-pbt

extra-deps:
# hs-pbt requires this QuickCheck; the snapshot ships a different one.
- QuickCheck-2.17.1.0
