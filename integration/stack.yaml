# Integration project for the cost-semantics translator.
#
# The project includes cost-translate ('..') and the patched MemoristANT
# runtime submodule ('../hs-pbt'; see ../patches/README.md).
# Same snapshot as the root project (lts-24.22, ghc-9.10.3) plus
# QuickCheck 2.17.1.0 required by hs-pbt.

snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/22.yaml

packages:
- .
- ..
- ../hs-pbt

extra-deps:
- QuickCheck-2.17.1.0

# MemoristANT is a dependency of the integration tests, not a warning-clean target.
apply-ghc-options: targets
